<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#09090b" />

  <!-- Subtle Vector Grid Lines -->
  <path d="M 128 384 L 384 384" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <path d="M 256 96 L 256 416" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Left Leg of "A" -->
  <path
    d="M 256 104 L 112 392 H 168 L 256 216 Z"
    fill="url(#monogramGrad)"
    opacity="0.9"
  />

  <!-- Right Leg of "A" -->
  <path
    d="M 256 104 L 400 392 H 344 L 256 216 Z"
    fill="url(#monogramGrad)"
  />

  <!-- Horizontal Crossbar Deck -->
  <path
    d="M 172 320 H 340 L 324 352 H 188 Z"
    fill="url(#monogramGrad)"
    opacity="0.75"
  />

  <!-- Floating Orbital Dot at Center Apex -->
  <circle cx="256" cy="180" r="22" fill="url(#accentDot)" />
  <circle cx="256" cy="180" r="8" fill="#ffffff" />
</svg>
