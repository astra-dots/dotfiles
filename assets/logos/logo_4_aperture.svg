<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#09090b" />

  <!-- Outer Squircle Ring -->
  <rect x="112" y="112" width="288" height="288" rx="80" fill="none" stroke="url(#orbitGrad)" stroke-width="6" opacity="0.85" />

  <!-- Diagonal 45-degree Rotated Inner Squircle -->
  <rect x="156" y="156" width="200" height="200" rx="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" transform="rotate(45 256 256)" />

  <!-- Center Glowing Astral Core -->
  <circle cx="256" cy="256" r="32" fill="url(#orbitGrad)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />

  <!-- 4 Corner Axis Dots -->
  <circle cx="112" cy="112" r="12" fill="#38bdf8" />
  <circle cx="400" cy="112" r="12" fill="#a855f7" />
  <circle cx="400" cy="400" r="12" fill="#f43f5e" />
  <circle cx="112" cy="400" r="12" fill="#38bdf8" />
</svg>
