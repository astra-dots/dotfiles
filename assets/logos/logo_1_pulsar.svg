<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pulsarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" filter="url(#blurFilter)" />

  <!-- Orbital Constellation Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 8" />

  <!-- The 4 Constellation Orbital Dots (Dotfiles) -->
  <circle cx="362" cy="150" r="10" fill="#38bdf8" />
  <circle cx="362" cy="362" r="8" fill="#fbbf24" />
  <circle cx="150" cy="362" r="10" fill="#818cf8" />
  <circle cx="150" cy="150" r="8" fill="#34d399" />

  <!-- Central Astra Star (Organic 4-Point Beziers) -->
  <path
    d="M 256 80
       Q 256 224 432 256
       Q 256 288 256 432
       Q 256 288 80 256
       Q 256 224 256 80 Z"
    fill="url(#pulsarGrad)"
  />

  <!-- High-Intensity Star Center Spark -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
